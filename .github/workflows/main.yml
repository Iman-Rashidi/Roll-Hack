name: CI

on:
  push:
    branches: [master, maintenance/**]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Node.js 22 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Check CLI help
        run: node src/cli.js --help
